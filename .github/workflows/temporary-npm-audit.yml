name: Temporary npm audit inspection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-npm-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Get patched source-map-js metadata
        run: |
          npm view source-map-js@1.2.2 version dist.integrity dist.tarball engines --json
