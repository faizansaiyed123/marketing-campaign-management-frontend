name: Temporary npm metadata lookup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temporary-npm-metadata.yml"

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare official Vite 6.4.3 and 6.4.4 metadata
        run: |
          echo "=== Vite 6.4.3 ==="
          npm view vite@6.4.3 version dist.integrity dist.tarball dependencies optionalDependencies engines --json
          echo "=== Vite 6.4.4 ==="
          npm view vite@6.4.4 version dist.integrity dist.tarball dependencies optionalDependencies engines --json
