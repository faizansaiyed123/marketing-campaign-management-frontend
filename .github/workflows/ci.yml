name: Frontend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies from lockfile
        run: npm ci
      - run: npm run build
      - name: Validate production Compose overlay
        env:
          VITE_API_URL: https://api.example.com
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config
      - name: Build production container image
        run: docker build --build-arg VITE_API_URL=https://api.example.com -t marketing-campaign-management-frontend:ci .
      - name: Smoke-test production container
        run: |
          docker run --detach --name marketing-campaign-frontend-ci -p 127.0.0.1:18080:8080 marketing-campaign-management-frontend:ci
          trap 'docker rm -f marketing-campaign-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/ -o /tmp/frontend-index.html -D /tmp/frontend-headers.txt; then
              break
            fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/frontend-index.html
          grep -qi '^x-frame-options: DENY' /tmp/frontend-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/frontend-headers.txt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      # Trailing slash intentionally exercises API base URL normalization in browser tests.
      VITE_API_URL: http://127.0.0.1:8000/
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/marketing-campaign-management-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          npm ci
      - name: Apply backend migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run frontend-backend integration tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
