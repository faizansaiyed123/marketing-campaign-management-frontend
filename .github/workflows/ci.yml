name: Frontend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Check for high and critical npm advisories
        run: npm audit --audit-level=high
      - name: Validate Vercel SPA configuration
        run: node -e 'const c = require("./vercel.json"); if (c.framework !== "vite" || c.installCommand !== "npm ci" || c.buildCommand !== "npm run build" || c.outputDirectory !== "dist" || !c.rewrites?.some(r => r.source === "/(.*)" && r.destination === "/index.html")) process.exit(1)'
      - name: Ensure production build refuses missing or unsafe API URLs
        run: |
          expect_failure() {
            local label="$1"
            local expected="$2"
            local logfile="$3"
            shift 3
            if "$@" >"$logfile" 2>&1; then
              echo "Production build unexpectedly accepted: $label" >&2
              cat "$logfile" >&2
              exit 1
            fi
            if ! grep -Fq "$expected" "$logfile"; then
              echo "Production build rejected $label, but not for the expected reason: $expected" >&2
              cat "$logfile" >&2
              exit 1
            fi
          }
          expect_failure "a missing API URL" "set VITE_API_URL" /tmp/missing-api-url.log npm run build:production
          expect_failure "an HTTP localhost API URL" "VITE_API_URL must be an HTTPS origin" /tmp/insecure-api-url.log env VITE_API_URL=http://localhost:8000 npm run build:production
          expect_failure "a reserved example API domain" "real public API hostname" /tmp/example-api-url.log env VITE_API_URL=https://api.example.com npm run build:production
          expect_failure "a copied yourdomain.com API placeholder" "real public API hostname" /tmp/yourdomain-api-url.log env VITE_API_URL=https://api.yourdomain.com npm run build:production
      - name: Build Vercel production bundle with same-origin API proxy
        run: npm run build
      - name: Validate production Compose overlay
        env:
          VITE_API_URL: https://api.campaign-ci.com
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml config
      - name: Build production container image
        run: docker build --build-arg VITE_API_URL=https://api.campaign-ci.com --build-arg DEPLOY_TARGET=production -t marketing-campaign-management-frontend:ci .
      - name: Ensure Docker production build rejects unsafe API URL
        run: |
          if docker build --target build --build-arg VITE_API_URL=http://localhost:8000 --build-arg DEPLOY_TARGET=production -t marketing-campaign-management-frontend:invalid-api-url . >/tmp/docker-invalid-api-url.log 2>&1; then
            echo "Docker production build unexpectedly accepted a localhost API URL." >&2
            exit 1
          fi
          grep -q "VITE_API_URL must be an HTTPS origin" /tmp/docker-invalid-api-url.log
          if docker build --target build --build-arg VITE_API_URL=https://api.yourdomain.com --build-arg DEPLOY_TARGET=production -t marketing-campaign-management-frontend:placeholder-api-url . >/tmp/docker-placeholder-api-url.log 2>&1; then
            echo "Docker production build unexpectedly accepted a yourdomain.com placeholder." >&2
            exit 1
          fi
          grep -q "real public API hostname" /tmp/docker-placeholder-api-url.log
      - name: Smoke-test production container
        run: |
          docker run --detach --name marketing-campaign-frontend-ci -p 127.0.0.1:18080:8080 marketing-campaign-management-frontend:ci
          trap 'docker rm -f marketing-campaign-frontend-ci >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/ -o /tmp/frontend-index.html -D /tmp/frontend-headers.txt; then
              break
            fi
            sleep 1
          done
          grep -q 'id="root"' /tmp/frontend-index.html
          grep -qi '^x-frame-options: DENY' /tmp/frontend-headers.txt
          grep -qi '^x-content-type-options: nosniff' /tmp/frontend-headers.txt

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      VITE_API_URL: http://127.0.0.1:8000/
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: faizansaiyed123/marketing-campaign-management-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          npm ci
      - name: Apply backend migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run frontend-backend integration tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
