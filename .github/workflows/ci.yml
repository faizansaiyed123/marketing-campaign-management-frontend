name: Frontend CI
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies and generate lockfile
        run: npm install
      - name: Commit generated lockfile on development
        if: github.ref == 'refs/heads/development'
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi
          if ! git status --porcelain -- package-lock.json | grep -q .; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campaigns
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campaigns"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campaigns
      ENVIRONMENT: test
      JWT_SECRET_KEY: ci-test-secret-with-at-least-32-bytes
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      VITE_API_URL: http://127.0.0.1:8000
      BACKEND_DIR: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: faizansaiyed123/marketing-campaign-management-backend
          ref: main
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend and frontend dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          npm install
      - name: Apply backend migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run frontend-backend integration tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
